# MILJØVARIABLER sættes i Netlify-UI'et, ikke her — så de kan sættes pr.
# kontekst uden at ligge i repoet.
#
#   Production            → PROD-nøgler (fleetcontrol-98e11)
#   Deploy previews       → DEV-nøgler  (fleetcontrol-dev)
#   Branch deploys        → DEV-nøgler
#
# Previews og branch-deploys må ALDRIG have produktionsnøgler. Miljøbjælken i
# AppShell fanger produktionsnøgler på localhost, men en preview kører på et
# netlify.app-domæne og ser derfor ud som almindelig produktion. Der er intet
# der advarer dig — det er derfor det står her.

[build]
  command = "npm run build"
  publish = "dist"

# SPA-fallback. Uden denne giver et direkte hit på /booking/disponering 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
